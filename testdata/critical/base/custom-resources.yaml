apiVersion: v1
kind: ConfigMap
metadata:
  name: binary-payload
binaryData:
  payload.bin: AP8Q
data:
  content-type: application/octet-stream
---
apiVersion: v1
kind: Secret
metadata:
  name: api-tls
type: kubernetes.io/tls
data:
  tls.crt: dGVzdC1jZXJ0aWZpY2F0ZQ==
  tls.key: dGVzdC1wcml2YXRlLWtleQ==
---
apiVersion: platform.example.com/v1
kind: Widget
metadata:
  name: primary
spec:
  mode: active
  nested:
    arbitrary:
      arrays:
        - name: first
          values: [1, "2", true, null]
        - name: second
          template: "{{ custom.resource.literal }}"
  rawDocument: |-
    apiVersion: imaginary/v1
    kind: Nested
    ---
    {{ still-literal }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-vault
    kind: ClusterSecretStore
  target:
    name: external-api-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config: |-
          username: "{{ .username }}"
          password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: services/api
        property: username
    - secretKey: password
      remoteRef:
        key: services/api
        property: password
