apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
namespace: development
images:
  - name: nginx
    newName: registry.example.com:5000/platform/nginx
    newTag: "2.0"
replicas:
  - name: app
    count: 4
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 64Mi
  - target:
      kind: Service
      name: app
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      $patch: delete
