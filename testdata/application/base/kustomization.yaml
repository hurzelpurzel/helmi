apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: app-config
    literals:
      - template={{ untouched }}
secretGenerator:
  - name: app-secret
    literals:
      - password=correct-horse
labels:
  - pairs:
      app.kubernetes.io/part-of: sample
    includeSelectors: false
